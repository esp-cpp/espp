## IDF Component Manager Manifest File - example project overrides.
##
## This file only affects THIS example build, not the published esp32-p4-wifi6-dev-kit
## component (whose own manifest keeps a clean `espp/audio: ">=1.0"`).
dependencies:
  # The esp32-p4-wifi6-dev-kit BSP depends on espp/audio, which is not yet published to
  # the ESP component registry. This example enables the component manager, so
  # the version solver would otherwise fail to find espp/audio in the registry.
  # Override it to the in-repo component for the example build. Remove this
  # override once espp/audio is published.
  espp/audio:
    version: "*"
    override_path: "../../../audio"
