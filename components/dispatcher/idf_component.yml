## IDF Component Manager Manifest File
license: "MIT"
description: "Multiplex several framed protocols (OTA, crash-dump, CAN bridge, app control, ...) over one byte stream: parses the stream_frame codec once and routes each frame to a per-module handler by the type byte's high-nibble module id"
url: "https://github.com/esp-cpp/espp/tree/main/components/dispatcher"
repository: "https://github.com/esp-cpp/espp.git"
maintainers:
  - William Emfinger <waemfinger@gmail.com>
documentation: "https://esp-cpp.github.io/espp/dispatcher/dispatcher.html"
examples:
  - path: example
tags:
  - cpp
  - Component
  - Protocol
  - Multiplex
  - Router
  - Framing
  - USB
dependencies:
  idf:
    version: '>=5.0'
  # stream_frame is a new espp component not published to the registry yet;
  # point at the local source until it is released.
  espp/stream_frame:
    version: '*'
    override_path: '../stream_frame'
