## IDF Component Manager Manifest File
license: "MIT"
description: "Waveshare ESP32-P4-WIFI6-POE-ETH Board Support Package (BSP) component in C++ (PoE-capable Ethernet, internal I2C; on-board ESP32-C6 for Wi-Fi 6 via ESP-Hosted)"
url: "https://github.com/esp-cpp/espp/tree/main/components/esp32-p4-wifi6-poe-eth"
repository: "https://github.com/esp-cpp/espp.git"
maintainers:
  - William Emfinger <waemfinger@gmail.com>
documentation: "https://esp-cpp.github.io/espp/dev_boards/waveshare/esp32_p4_wifi6_poe_eth.html"
examples:
  - path: example
tags:
  - cpp
  - Component
  - BSP
  - ESP32P4
  - Ethernet
  - PoE
  - WiFi6
  - Waveshare
dependencies:
  idf:
    # 5.4 is the floor because espp/ethernet (RMII via esp_eth_phy_new_generic and
    # split esp_driver_* components) requires ESP-IDF >=5.4.
    version: ">=5.4"
  espp/base_component: ">=1.0"
  espp/ethernet: ">=1.0"
  espp/i2c: ">=1.0"
targets:
  - esp32p4
