## IDF Component Manager Manifest File
license: "MIT"
description: "Composable native USB device (esp_tinyusb): CDC-ACM, vendor-specific/WebUSB, HID, X-Input and mass storage (MSC) with configurable VID/PID for ESP-IDF"
url: "https://github.com/esp-cpp/espp/tree/main/components/usb_device"
repository: "git://github.com/esp-cpp/espp.git"
maintainers:
  - William Emfinger <waemfinger@gmail.com>
documentation: "https://esp-cpp.github.io/espp/buses/usb_cdc.html"
examples:
  - path: example
  - path: xinput_example
  - path: msc_example
tags:
  - cpp
  - Component
  - USB
  - CDC
  - Vendor
  - WebUSB
  - TinyUSB
  - Serial
  - Transport
  - HID
  - XInput
  - Gamepad
  - MSC
  - Mass-Storage
  - SD-Card
dependencies:
  idf:
    version: '>=5.3'
  espp/base_component: '>=1.0'
  # >= 3.0.0: esp_tinyusb ships TinyUSB (0.21.0~2 in 3.0.0) as its own
  # submodule and no longer depends on the registry `tinyusb` component. Do not
  # add a `tinyusb` dependency here: with esp_tinyusb 3.x it pulls a second copy
  # of the stack that cannot find tusb_config.h and the build fails. 3.0.0 also
  # carries everything this component needs from 2.x (MSC multitask protection
  # and delete_storage() refusing to free a storage with host writes queued) and
  # the TinyUSB 0.21 5-argument usbd_edpt_xfer(..., is_isr) the X-Input class
  # driver uses. esp_tinyusb 3.x requires ESP-IDF >= 5.3.
  espressif/esp_tinyusb: '>=3.0.0'
