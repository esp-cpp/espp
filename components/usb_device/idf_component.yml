## IDF Component Manager Manifest File
license: "MIT"
description: "Composable native USB device (esp_tinyusb): CDC-ACM + vendor-specific/WebUSB with configurable VID/PID for ESP-IDF"
url: "https://github.com/esp-cpp/espp/tree/main/components/usb_device"
repository: "git://github.com/esp-cpp/espp.git"
maintainers:
  - William Emfinger <waemfinger@gmail.com>
documentation: "https://esp-cpp.github.io/espp/buses/usb_cdc.html"
examples:
  - path: example
tags:
  - cpp
  - Component
  - USB
  - CDC
  - Vendor
  - WebUSB
  - TinyUSB
  - Serial
  - Transport
dependencies:
  idf:
    version: '>=5.0'
  espp/base_component: '>=1.0'
  espressif/esp_tinyusb: '>=2.0'
  # The X-Input class driver uses the usbd_class_driver_t `xfer_isr` member and
  # the 5-argument usbd_edpt_xfer(..., is_isr) API, both TinyUSB >= 0.19. esp_tinyusb
  # only requires tinyusb >= 0.17, so pin the newer floor here.
  tinyusb:
    version: '>=0.19.0'
    public: true
