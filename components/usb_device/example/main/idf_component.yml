## IDF Component Manager Manifest File - example project overrides.
##
## The component manager is ENABLED for this example so it can fetch the managed
## `espressif/esp_tinyusb` component from the ESP registry. The espp components
## are resolved to their in-repo copies via override_path so the version solver
## does not try to fetch them from the registry.
dependencies:
  idf:
    version: '>=5.0'
  espressif/esp_tinyusb: '>=1.4'
  espp/base_component:
    version: '*'
    override_path: '../../../base_component'
  espp/logger:
    version: '*'
    override_path: '../../../logger'
  espp/format:
    version: '*'
    override_path: '../../../format'
  espp/odrive_ascii:
    version: '*'
    override_path: '../../../odrive_ascii'
  espp/usb_device:
    version: '*'
    override_path: '../..'
