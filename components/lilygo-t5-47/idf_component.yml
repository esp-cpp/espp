## IDF Component Manager Manifest File
license: "MIT"
description: "LilyGo T5 4.7 inch ESP32-S3 e-paper Board Support Package (BSP) component for ESPP"
url: "https://github.com/esp-cpp/espp/tree/main/components/lilygo-t5-47"
repository: "git://github.com/esp-cpp/espp.git"
maintainers:
  - William Emfinger <waemfinger@gmail.com>
examples:
  - path: example
tags:
  - cpp
  - Component
  - LilyGo
  - T5-47
  - e-paper
  - epaper
  - BSP
dependencies:
  idf:
    version: ">=5.0"
  espp/base_component: ">=1.0"
  espp/task: ">=1.0"
  espp/interrupt: ">=1.0"
  espp/i2c: ">=1.0"
  espp/sdcard: ">=1.0"
  espp/spi: ">=1.0"
  espp/gt911: ">=1.0"
  espp/bm8563: ">=1.0"
  espp/bq27220: ">=1.0"
  espp/pca9535: ">=1.0"
  espp/sx126x: ">=1.0"
  espp/input_drivers: ">=1.0"
  lvgl/lvgl: ">=9.2.2"
  # epdiy drives the ED047TC1 parallel e-paper panel (waveforms, grayscale,
  # partial updates) for this exact board. From the registry: the registry does
  # not accept components with git dependencies, so a git source here would
  # keep this BSP unpublishable.
  vroland/epdiy: "^2.1.3"
targets:
  - esp32s3
