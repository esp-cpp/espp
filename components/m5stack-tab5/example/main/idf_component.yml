## IDF Component Manager Manifest File
##
## The espp components are provided locally via EXTRA_COMPONENT_DIRS in the
## example's CMakeLists.txt; only the managed camera pipeline components are
## fetched from the registry here.
dependencies:
  idf:
    version: ">=5.3"
  # MIPI-CSI camera: V4L2 capture framework (CSI + ISP) and the SC202CS driver.
  espressif/esp_video: ">=2.0"
  espressif/esp_cam_sensor: ">=2.0"
