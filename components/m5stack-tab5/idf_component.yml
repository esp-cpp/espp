## IDF Component Manager Manifest File
license: "MIT"
description: "M5Stack Tab5 Board Support Package (BSP) component in C++ for ESP32-P4"
url: "https://github.com/esp-cpp/espp/tree/main/components/m5stack-tab5"
repository: "git://github.com/esp-cpp/espp.git"
maintainers:
  - William Emfinger <waemfinger@gmail.com>
documentation: "https://esp-cpp.github.io/espp/dev_boards/m5stack/m5stack_tab5.html"
examples:
  - path: example
tags:
  - cpp
  - Component
  - M5Stack
  - Tab5
  - BSP
dependencies:
  idf: ">=5.0"
  espp/base_component: ">=1.0"
  espp/bmi270: ">=1.0"
  espp/codec: ">=1.0"
  espp/display: ">=1.0"
  espp/display_drivers: ">=1.0"
  espp/gt911: ">=1.0"
  espp/i2c: ">=1.0"
  espp/ina226: ">=1.0"
  espp/input_drivers: ">=1.0"
  espp/interrupt: ">=1.0"
  espp/pi4ioe5v: ">=1.0"
  espp/rx8130ce: ">=1.0"
  espp/st7123touch: ">=1.0"
  espp/task: ">=1.0"
  # MIPI-CSI camera pipeline: esp_video provides the V4L2 capture framework
  # (CSI + ISP) and esp_cam_sensor provides the SC202CS sensor driver.
  # The 2026-08-18 release wave is broken: esp_video 2.4.0 fails to compile
  # against the CI IDF (ISP_LL_EVENT_ERROR_MASK undeclared) and the PREBUILT
  # esp_ipa 2.3.0 it pairs with hits an illegal instruction in
  # esp_ipa_pipeline_create() at runtime on the ESP32-P4. Pin the known-good
  # pairing (esp_video 2.3.0 + esp_ipa 2.2.x + esp_cam_sensor 2.3.x) until
  # upstream is fixed.
  espressif/esp_video: ">=2.0,<2.4" # 2.4.0 fails to compile against the CI IDF (ISP_LL_EVENT_ERROR_MASK undeclared)
  espressif/esp_ipa: ">=2.0,<2.3" # prebuilt 2.3.0 illegal-instructions at runtime on P4
  espressif/esp_cam_sensor: ">=2.0,<2.4"
targets:
  - esp32p4
