## IDF Component Manager Manifest File — example project overrides.
##
## This file only affects THIS example build, not the published esp32-p4-module-dev-kit
## component (whose own manifest keeps a clean `espp/ethernet: ">=1.0"`).
dependencies:
  # The esp32-p4-module-dev-kit BSP depends on espp/ethernet, which is not yet published to
  # the ESP component registry. This example enables the component manager (needed
  # to fetch the managed camera components espressif/esp_video + esp_cam_sensor),
  # so the version solver would otherwise fail to find espp/ethernet in the
  # registry. Override it to the in-repo component for the example build. Remove
  # this override once espp/ethernet is published to the registry.
  espp/ethernet:
    version: "*"
    override_path: "../../../ethernet"
