## IDF Component Manager Manifest File
license: "MIT"
description: "Native USB host (ESP-IDF USB Host library + usb_host_hid): enumerate and talk to USB HID devices (mice, keyboards, gamepads, vendor HID) from an ESP32-S2/-S3/-P4"
url: "https://github.com/esp-cpp/espp/tree/main/components/usb_host"
repository: "https://github.com/esp-cpp/espp.git"
maintainers:
  - William Emfinger <waemfinger@gmail.com>
documentation: "https://esp-cpp.github.io/espp/usb_host/usb_host.html"
examples:
  - path: example
  - path: tab5_example
tags:
  - cpp
  - Component
  - USB
  - Host
  - HID
  - Transport
  - Gamepad
dependencies:
  # ESP-IDF >= 6.0: the USB Host library is no longer part of IDF itself but
  # the esp-usb `usb` component from the registry, and `usb_host_hid` only
  # declares that dependency on IDF >= 6.0. Both are pinned to the floors this
  # component needs: `root_port_unpowered` / usb_host_lib_set_root_port_power()
  # (usb 1.0.0) and `peripheral_map` (usb 1.3.0, ESP32-P4 dual host).
  idf:
    version: '>=6.0'
  espp/base_component: '>=1.0'
  espp/task: '>=1.0'
  espressif/usb:
    version: '>=1.3.0'
    public: true
  espressif/usb_host_hid:
    version: '>=1.0.0'
    public: true
