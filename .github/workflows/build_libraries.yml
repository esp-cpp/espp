name: Build Host C++ / Python Libraries

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Supersede in-progress runs: a new commit on the same PR cancels the earlier,
# now-stale build. Keyed by the workflow (so it never cross-cancels other
# workflows) + the PR number, which is globally unique - unlike the head branch
# name, two fork PRs can't collide on it. Falls back to github.ref otherwise.
# cancel-in-progress is gated to pull_request events only so that push-to-main
# (and release) runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_windows:
    # Skip build CI for draft PRs; still runs on push-to-main and non-draft PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: windows-latest
    continue-on-error: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Build libraries
      working-directory: lib/
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build . --config Release --target install

    - name: Upload output folder
      uses: actions/upload-artifact@v7
      with:
        name: libespp_windows
        path: lib/pc

  build_linux:
    # Skip build CI for draft PRs; still runs on push-to-main and non-draft PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Build libraries
      working-directory: lib/
      run: |
        ./build.sh

    - name: Upload output folder
      uses: actions/upload-artifact@v7
      with:
        name: libespp_linux
        path: lib/pc

  build_macos:
    # Skip build CI for draft PRs; still runs on push-to-main and non-draft PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: macos-latest
    continue-on-error: false

    steps:
    - name: Setup XCode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Build libraries
      working-directory: lib/
      run: |
        ./build.sh

    - name: Upload output folder
      uses: actions/upload-artifact@v7
      with:
        name: libespp_macos
        path: lib/pc
