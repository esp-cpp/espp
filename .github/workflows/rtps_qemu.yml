name: RTPS interop in QEMU (esp32 target)

# The embedded RTPS engine - the esp32 configuration profile, lwIP, FreeRTOS -
# running in Espressif's QEMU against FastDDS, CycloneDDS / ROS 2 and the espp
# host engine, on a tap device inside the interop container, with the device
# log asserted on. The host-build matrix (rtps_interop.yml) covers the same
# peers against the desktop build; this one covers what only the target can
# show: the embedded pools and knobs, lwIP, FreeRTOS scheduling, fragmentation
# over the real stack, delivery under injected loss / reordering / duplication
# / delay / corruption, and the heap over minutes of churn (the soak), and the
# memory footprint by limits profile (the memory suite: sizeof of the engine's
# objects, the internal-RAM / PSRAM split by stage, per remote participant, per
# matched endpoint, per service call). One firmware build per limits profile;
# the matrix and the soak run on the embedded one. See
# components/rtps/interop/README.md.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "components/rtps/**"
      - "components/qemu/**"
      - "components/ethernet/**"
      - "components/socket/**"
      - "components/cdr/**"
      - "lib/espp.cmake"
      - "pc/tests/rtps_interop_*"
      - ".github/workflows/rtps_qemu.yml"
  # On main as well, for the same paths: a main run's memory numbers are the
  # baseline the next pull requests' reports show their deltas against (the
  # memory job fetches the latest main run's rtps-memory artifact whose memory
  # job passed). The whole workflow runs there on purpose - the matrix and the
  # soak on main are the regression gate a pull request's run can only
  # approximate - at the cost of one QEMU run per push that touches the engine.
  push:
    branches: [main]
    paths:
      - "components/rtps/**"
      - "components/qemu/**"
      - "components/ethernet/**"
      - "components/socket/**"
      - "components/cdr/**"
      - "lib/espp.cmake"
      - "pc/tests/rtps_interop_*"
      - ".github/workflows/rtps_qemu.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The limits profile the firmware is built with (menuconfig RTPS ->
        # capacity limits). embedded is the one the interop suites run on;
        # the others exist for the memory suite's comparison.
        profile: [embedded, host, host_large]
        include:
          - profile: embedded
            defaults: "sdkconfig.defaults;sdkconfig.ci.defaults"
          - profile: host
            defaults: "sdkconfig.defaults;sdkconfig.ci.defaults;sdkconfig.profile.host.defaults"
          - profile: host_large
            defaults: "sdkconfig.defaults;sdkconfig.ci.defaults;sdkconfig.profile.host_large.defaults"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Build the firmware (esp32, ${{ matrix.profile }} limits profile, static address for the tap)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: components/rtps/interop/qemu
          command: >-
            idf.py -DSDKCONFIG=build/sdkconfig -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build
            && idf.py -DSDKCONFIG=build/sdkconfig size-components --format json2 --output-file build/size-components.json
            && cd build
            && python -m esptool --chip esp32 merge-bin --fill-flash-size 4MB -o qemu_flash.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true # a re-run of a failed job replaces its artifact (v4 refuses otherwise)
          name: qemu-flash-${{ matrix.profile }}
          path: |
            components/rtps/interop/qemu/build/qemu_flash.bin
            components/rtps/interop/qemu/build/size-components.json
          if-no-files-found: error

  qemu:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: [matrix, soak]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - uses: actions/download-artifact@v4
        with:
          name: qemu-flash-embedded
          path: components/rtps/interop/qemu/build
      - name: Run the QEMU ${{ matrix.suite }} suite
        run: |
          cd components/rtps/interop
          ./run_qemu.sh "$PWD/qemu/build/qemu_flash.bin" ${{ matrix.suite }}
      - name: Device log (tail)
        if: always()
        run: |
          f=components/rtps/interop/qemu/build/qemu-serial.log
          if [ -f "$f" ]; then sed 's/\x1b\[[0-9;]*m//g' "$f" | tail -300; else echo "no device log"; fi
      - name: Device log (full, as an artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-device-log-${{ matrix.suite }}
          path: components/rtps/interop/qemu/build/qemu-serial.log
          if-no-files-found: ignore

  memory:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # the report as a comment on the pull request: an issue comment, but on a
      # pull_request event GitHub checks the pull-requests permission for it
      issues: write
      pull-requests: write
      # to list main's runs and download the baseline's rtps-memory artifact
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - uses: actions/download-artifact@v4
        with:
          pattern: qemu-flash-*
          path: components/rtps/interop/qemu/images
      - name: Fetch the baseline (the latest run on main whose memory job passed)
        # The report compares every number against main's latest run of this
        # workflow (its rtps-memory artifact): a pull request's cost reads as
        # a delta, not as another absolute figure. On a push to main the
        # baseline is the previous main run, so the merge's own delta shows in
        # the step summary. The baseline is chosen by its MEMORY job having
        # passed, not by the whole run's conclusion: a soak or matrix flake on
        # main must not quietly move the baseline back to an older commit. No
        # baseline (the first run, expired artifacts): the report says why and
        # prints the absolute numbers.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Whatever happens below, the report learns why there is no baseline:
          # `reason` describes the NEWEST run that could not serve (the one a
          # maintainer wants to know about), and is written on every exit path.
          reason=""
          miss() { [ -n "$reason" ] || reason="$1"; }
          finish() { if [ -z "${RTPS_MEMORY_BASELINE:-}" ]; then echo "no baseline: ${reason:-no completed run of this workflow on main yet}"; echo "RTPS_MEMORY_BASELINE_LABEL=${reason:-no completed run of this workflow on main yet}" >> "$GITHUB_ENV"; fi; }
          trap finish EXIT
          # The most recent completed runs ON main - pushes, or the manual dispatch
          # that seeds the first one. `--branch` matches a run's HEAD branch, which
          # for a pull request from a fork is the fork's branch name: a fork PR from
          # a branch called "main" must never become the baseline, hence the event
          # filter. The workflow is named by its file, so a renamed `name:` on a
          # pull request still finds main's runs. Cancelled runs are "completed" too
          # (every push to main cancels the previous one), so the window is wide.
          runs=$(gh run list --workflow rtps_qemu.yml --branch main --status completed --limit 30 \
                   --json databaseId,event --jq '.[] | select(.event == "push" or .event == "workflow_dispatch") | .databaseId') \
            || { miss "could not list the workflow's runs on main (gh run list failed)"; runs=""; }
          for run_id in $runs; do
            memory=$(gh run view "$run_id" --json jobs --jq '[.jobs[] | select(.name == "memory") | .conclusion][0] // empty') \
              || { miss "could not read main run $run_id (gh run view failed)"; continue; }
            if [ "$memory" != success ]; then miss "the latest main run's memory job did not pass (run $run_id: ${memory:-no memory job})"; continue; fi
            rm -rf baseline && mkdir -p baseline
            if gh run download "$run_id" -n rtps-memory -D baseline && [ -s baseline/rtps-memory.json ]; then
              sha=$(gh run view "$run_id" --json headSha --jq '.headSha[0:9]') || sha=unknown
              echo "baseline: main @ $sha, run $run_id"
              echo "RTPS_MEMORY_BASELINE=$PWD/baseline/rtps-memory.json" >> "$GITHUB_ENV"
              echo "RTPS_MEMORY_BASELINE_LABEL=main @ $sha ([run ${run_id}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${run_id}))" >> "$GITHUB_ENV"
              RTPS_MEMORY_BASELINE=set
              exit 0
            fi
            miss "the rtps-memory artifact of main run $run_id is gone (expired?)"
          done
      - name: Run the memory suite on every limits profile
        # The embedded firmware runs the host-driven steps as well; the other
        # profiles boot for their sizeof and stage markers only.
        # Every profile runs (a failure in one must not hide the others'
        # numbers); the step fails afterwards if any did, and the report and
        # the artifact below still publish (always()).
        run: |
          cd components/rtps/interop
          failed=""
          for profile in embedded host host_large; do
            dir="$PWD/qemu/images/qemu-flash-$profile"
            if [ "$profile" = embedded ]; then unset MEMORY_STAGES_ONLY; else export MEMORY_STAGES_ONLY=1; fi
            # the suite writes memory.json and the device log next to the image
            ./run_qemu.sh "$dir/qemu_flash.bin" memory || failed="$failed $profile"
          done
          if [ -n "$failed" ]; then echo "memory suite failed for:$failed"; exit 1; fi
      - name: Report
        if: always()
        run: |
          cd components/rtps/interop/qemu
          rm -f rtps-memory-report.md
          # with a baseline: deltas against it; without: the label says why there is none
          baseline_args=()
          if [ -n "${RTPS_MEMORY_BASELINE:-}" ] && [ -s "$RTPS_MEMORY_BASELINE" ]; then
            baseline_args=(--baseline "$RTPS_MEMORY_BASELINE")
          fi
          if [ -n "${RTPS_MEMORY_BASELINE_LABEL:-}" ]; then
            baseline_args+=(--baseline-label "$RTPS_MEMORY_BASELINE_LABEL")
          fi
          python3 memory_report.py --summary rtps-memory-report.md --json rtps-memory.json "${baseline_args[@]}" \
            $(for p in embedded host host_large; do d="images/qemu-flash-$p"; echo "$p:$d/memory.json:$d/size-components.json"; done)
          cat rtps-memory-report.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Post the report on the pull request
        # As esp-cpp/esp-idf-size-delta does: one comment per pull request,
        # found by its identifier and updated in place on every run, so the
        # thread does not fill up with tables. Only for pull requests from this
        # repository: a fork's token cannot write comments.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const identifier = '<!-- rtps-memory-report -->';
            const report = fs.readFileSync('components/rtps/interop/qemu/rtps-memory-report.md', 'utf8');
            const sha = context.payload.pull_request.head.sha.slice(0, 9);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${identifier}\n${report}\n_The QEMU memory suite on ${sha} ([run](${runUrl})); the full numbers are the run's \`rtps-memory\` artifact._\n`;
            const {owner, repo, number} = context.issue;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: number});
            const existing = comments.find(c => c.body && c.body.includes(identifier));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
              console.log(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: number, body});
              console.log('Created the comment');
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true # a re-run of a failed job replaces its artifact (v4 refuses otherwise)
          name: rtps-memory
          path: |
            components/rtps/interop/qemu/rtps-memory.json
            components/rtps/interop/qemu/images/*/memory.json
            components/rtps/interop/qemu/images/*/qemu-serial.log
          if-no-files-found: ignore
