name: Push component to https://components.espressif.com
on:
  # For pull requests: perform upload with "--dry-run" argument,
  # i.e. validate that the component passes all checks for being uploaded.
  pull_request:

  release:
    types: [published]

jobs:
  upload_components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Upload components to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          # Please try to keep the directories list sorted.
          #
          # Do note, however, that if you are updating two components in the same PR
          # and one depends on the other, the new version of the 2nd component won't
          # be found in the registry when the 1st component is uploaded.
          #
          # This is only a problem if you are adding two components for the first time,
          # or if the 2nd component depends on the exact (new) version of the first one.
          #
          # Note: ethernet is intentionally listed ahead of the esp32-p4-* board
          #       BSPs (esp32-p4-eth / esp32-p4-function-ev-board /
          #       esp32-p4-module-dev-kit / esp32-p4-nano /
          #       esp32-p4-wifi6-dev-kit / esp32-p4-wifi6-poe-eth), 
          #       which depend on espp/ethernet, so
          #       ethernet is uploaded to the registry ahead of them.
          #
          # Note: magnetic_encoder is intentionally listed ahead of as5600 and
          #       mt6701, which depend on espp/magnetic_encoder, so it is
          #       uploaded to the registry first.
          #
          # Note: stream_frame is intentionally listed (out of alphabetical order)
          #       ahead of its first-time dependents coredump / dispatcher / ota,
          #       so it is uploaded to the registry before they try to resolve it.
          #
          # Note: comments are not allowed in the "components" list, so please
          #       do not add any comments here.
          components: |
            components/magnetic_encoder
            components/adc
            components/adrc
            components/ads1x15
            components/ads7138
            components/adxl345
            components/as5600
            components/at581x
            components/aw9523
            components/base_component
            components/base_peripheral
            components/basicmicro
            components/mcp266
            components/bdc_driver
            components/binary-log
            components/bldc_current_sense
            components/bldc_driver
            components/bldc_haptics
            components/bldc_motor
            components/bldc_types
            components/ble_gatt_server
            components/bm8563
            components/bmi270
            components/button
            components/byte90
            components/canopen
            components/chsc6x
            components/cdr
            components/cli
            components/cobs
            components/codec
            components/color
            components/controller
            components/stream_frame
            components/coredump
            components/cst816
            components/csv
            components/dispatcher
            components/display
            components/display_drivers
            components/dns_server
            components/drv2605
            components/encoder
            components/esp-box
            components/ethernet
            components/esp32-p4-eth
            components/esp32-p4-function-ev-board
            components/esp32-p4-module-dev-kit
            components/esp32-p4-nano
            components/esp32-p4-wifi6-dev-kit
            components/esp32-p4-wifi6-poe-eth
            components/esp32-timer-cam
            components/event_manager
            components/expressive_eyes
            components/file_system
            components/filters
            components/format
            components/ft5x06
            components/ftp
            components/gfps_service
            components/gps
            components/gt911
            components/hid_service
            components/hid-rp
            components/i2c
            components/icm20948
            components/icm42607
            components/ina226
            components/input_drivers
            components/interrupt
            components/iperf_menu
            components/joystick
            components/kts1622
            components/led
            components/led_strip
            components/logger
            components/lp5817
            components/lsm6dso
            components/m5stack-cardputer
            components/m5stack-tab5
            components/math
            components/matouch-rotary-display
            components/max1704x
            components/mcp23x17
            components/meshtastic
            components/monitor
            components/motorgo-axis
            components/motorgo-mini
            components/motorgo-plink
            components/mt6701
            components/ndef
            components/neopixel
            components/nvs
            components/odrive_ascii
            components/odrive_native
            components/ota
            components/pcf85063
            components/pi4ioe5v
            components/pid
            components/ping
            components/provisioning
            components/qmi8658
            components/qtpy
            components/qwiicnes
            components/reflect_cpp
            components/remote_debug
            components/rmt
            components/rtps
            components/rtsp
            components/runqueue
            components/rx8130ce
            components/seeed-studio-round-display
            components/serialization
            components/smartpanlee-sc01-plus
            components/socket
            components/spi
            components/st25dv
            components/st7123touch
            components/state_machine
            components/sx126x
            components/t_keyboard
            components/t-deck
            components/t-dongle-s3
            components/tabulate
            components/task
            components/thermistor
            components/thread_pool
            components/timer
            components/touch
            components/tla2528
