name: RTPS interop (FastDDS / ROS 2)

# Minimal token scope: the harness only checks out and builds, never writes.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "components/rtps_embedded/**"
      - "components/rtps/**"
      - "components/socket/**"
      - "components/cdr/**"
      - "lib/espp.cmake"
      - "pc/tests/rtps_embedded_*"
      - ".github/workflows/rtps_interop.yml"
  workflow_dispatch:

# Supersede in-progress runs: a new commit on the same PR (or the same branch for
# a manual dispatch) cancels the earlier, now-stale interop run. Grouped by the
# PR head branch (github.head_ref) so runs on different PRs never cancel each
# other; falls back to github.ref for workflow_dispatch. This workflow never runs
# on push to main, so cancel-in-progress is always safe here.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Run interop matrix
        run: |
          cd components/rtps_embedded/interop
          ./run.sh
